name: 更新作品集的即時數字

on:
  schedule:
    - cron: '17 * * * *'   # 每小時一次
  workflow_dispatch:        # Actions 頁面可以手動按「Run workflow」立刻更新

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 測試
        run: python -m unittest discover -s tests -v
      - name: 抓 GitHub 最新狀態
        env:
          # 沒設 PORTFOLIO_TOKEN 時用內建 token：只看得到公開 repo，私有作品維持手寫內容
          GH_TOKEN: ${{ secrets.PORTFOLIO_TOKEN || github.token }}
        run: python scripts/update_live.py
      - name: 有變化才 commit
        run: |
          if git diff --quiet -- data/live.js llms.txt index.html; then echo "沒有變化"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.js llms.txt index.html
          git commit -m "chore: 自動更新作品集即時數字"
          git push
